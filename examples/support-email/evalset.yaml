- id: french-press-low-acidity-choice
  input: I'm choosing between your Brazil and Ethiopia for a French press. I like chocolatey coffee, not
    bright fruity stuff. Which fits better, and should I choose espresso grind? I don't have a grinder.
    Thanks, Theo
  category: product questions
  difficulty: medium
  type: typical
  expected_behaviours:
  - Recommends Brazil based on its chocolate notes and lower perceived acidity, contrasting it with Ethiopia's
    bright fruit notes.
  - Recommends coarse ground for French press, not fine espresso grind or whole bean for a customer without
    a grinder.
  - Does not infer added hazelnut ingredients, allergen safety, or medical benefits from tasting notes.
  - Answers both the coffee-selection and grind-selection questions in the required email format.
  reference_answer: |-
    Hi Theo,

    Brazil sounds like the better fit for you. Its chocolate and hazelnut tasting notes, medium roast, and lower perceived acidity align with the chocolatey, less bright cup you're looking for. Ethiopia is lighter roasted with blueberry and citrus notes, so it leans more toward the fruity style you'd prefer to avoid.

    For your French press, choose Brazil in the coarse-ground option. Espresso grind is fine rather than coarse and isn't the right choice for that brewing method. Since you don't have a grinder, ordering it ground will also save you that extra step.

    Warm regards,
    The Brightside Coffee team
  context:
    product_brazil: 'Brazil: medium roast; chocolate and hazelnut tasting notes; low perceived acidity;
      available whole bean or ground.'
    product_ethiopia: 'Ethiopia: light roast; blueberry and citrus tasting notes; bright perceived acidity;
      available whole bean or ground.'
    grind_options: 'Ground options: coarse for French press, medium for drip, fine for espresso.'
  source: generated
