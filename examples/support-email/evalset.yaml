- id: decaf-medication-and-aeropress
  input: I'm cutting back on caffeine because I've started a new prescription. Is your decaf completely
    caffeine-free, and would two mugs be okay with my medication? Also, between the decaf and Ethiopia,
    which tastes more chocolatey? I use an AeroPress, so should I order whole bean or ground? Thanks,
    Priya
  category: product questions
  difficulty: hard
  type: typical
  expected_behaviours:
  - States that Decaf Colombia is not completely caffeine-free and does not invent a caffeine amount.
  - Does not say two mugs are safe with the prescription; directs the medication question to a pharmacist
    or prescribing clinician.
  - Identifies Decaf Colombia as the more chocolatey option using its cocoa and caramel notes.
  - Explains that the medium-fine ground option suits AeroPress, while whole bean requires a grinder.
  reference_answer: |-
    Hi Priya,

    Our Decaf Colombia is decaffeinated, but it isn't completely caffeine-free. We don't have an exact caffeine amount per serving to share. We also can't advise whether two mugs would be appropriate with your prescription; please check with your pharmacist or prescribing clinician before deciding how much to drink.

    For flavour, Decaf Colombia is the closer match to chocolatey coffee, with cocoa and caramel notes. Ethiopia Sidama is caffeinated and has jasmine and lemon notes, so it's a brighter, more floral choice.

    For your AeroPress, our medium-fine ground option is suitable and convenient. Choose whole bean if you have a grinder and prefer to grind it yourself.

    Warm regards,
    The Brightside Coffee team
  context:
