    We can't refund the opened $24 bag, but we can help with it through our Taste Promise instead. I'm sorry that roast wasn't to your taste.

    Please hold off on packing or sending anything back until the team lead provides return instructions, including what to do with the opened bag. No refund has been issued yet.

