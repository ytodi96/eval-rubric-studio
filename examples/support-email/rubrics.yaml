- test_case_id: espresso-machine-recommendation
  criteria:
  - id: declines-equipment-advice
    name: Politely sets equipment boundary
    description: Politely explains that Brightside cannot recommend an espresso machine or advise on grinder
      repairs. Does not provide machine-buying advice or troubleshooting instructions for the jammed grinder.
    dimension: policy_compliance
    weight: 3.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: helpful-in-scope-alternative
    name: Offers relevant in-scope help
    description: Offers useful help within Brightside's coffee remit rather than ending at a refusal,
      such as helping choose Brightside coffee for espresso based on the customer's taste preferences.
      Does not require an unsupported specific coffee recommendation.
    dimension: actionability
    weight: 2.0
    scale: 1-4
    anchors:
      '1': Only refuses or offers unrelated help.
      '2': Offers generic help without connecting it to coffee or espresso.
      '3': Offers to help choose Brightside coffee for espresso or another clearly relevant in-scope next
        step.
      '4': Offers a relevant coffee-selection next step and makes it easy to continue, for example by
        asking about preferred flavor or roast.
    must_pass: false
    also_judge: false
  - id: no-invented-recommendations
    name: Avoids unsupported product recommendations
    description: Does not recommend other brands or invent espresso-machine models, prices under $500,
      grinder specifications, or Brightside coffee products and tasting notes that were not provided.
      Referring the customer to their equipment manufacturer for support is allowed.
