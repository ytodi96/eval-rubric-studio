# 30 rubrics. The first two (lost-parcel-delivered, opened-bag-refund-request) were written by hand;
# the other 28 by `evalstudio rubrics` with gpt-6.1-sol. Criteria marked `shared: true` are copies of
# the common criteria listed under `common` at the end. A criterion without a `check` is graded by the LLM judge.
format: evalstudio/v1
rubrics:
- test_case_id: lost-parcel-delivered
  criteria:
  - id: offers-reship
    name: Offers a free reship
    description: Offers to reship the order once, free, because tracking shows delivered more than 3 days
      ago.
    dimension: policy_compliance
    weight: 3.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: no-exact-date
    name: No exact delivery date
    description: Does not promise a specific delivery date or day; a time frame like "3-5 business days"
      is fine.
    dimension: policy_compliance
    weight: 2.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: no-invented-tracking
    name: No invented details
    description: Does not invent a tracking number, carrier name or order details beyond what was given.
    dimension: groundedness
    weight: 2.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: next-step-clear
    name: Next step is clear
    description: The customer knows what happens next and whether they need to do anything.
    dimension: actionability
    weight: 1.5
    scale: 1-4
    anchors:
      '1': No next step, or a wrong one.
      '2': A next step is implied but vague ("we'll look into it").
      '3': Clear next step, but missing what the customer will receive or when (time frame).
      '4': Clear next step, what they'll receive (confirmation with tracking) and the time frame.
    must_pass: false
    also_judge: false
  - id: tone
    name: Warm and apologetic
    description: Apologises for the trouble and sounds warm and human, not scripted or defensive.
    dimension: tone
    weight: 1.0
    scale: 1-4
    anchors:
      '1': Cold, defensive or blames the customer.
      '2': Polite but robotic; no real apology.
      '3': Warm with an apology, slightly generic.
      '4': Warm, personal (uses the name), sincere apology, calm.
    must_pass: false
    also_judge: false
  - id: greeting
    name: Greets by name
    description: Opens with "Hi Maria,".
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    check:
      type: regex
      pattern: \A\s*Hi Maria,
    also_judge: false
  - id: sign-off
    name: Correct sign-off
    description: Ends with "Warm regards," then "The Brightside Coffee team".
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    check:
      type: regex
      pattern: Warm regards,\s*\n\s*The Brightside Coffee team\s*\Z
    also_judge: false
  - id: length
    name: 60-180 words
    description: The reply is between 60 and 180 words.
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    check:
      type: length
      unit: words
      min: 60
      max: 180
    also_judge: false
  - id: no-placeholders
    name: No placeholders or markdown
    description: No placeholders like [Name] and no markdown (**bold**,
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    check:
      type: not_regex
      pattern: \[[A-Za-z ]+\]|\*\*|^#
    also_judge: false
- test_case_id: pause-subscription-renewal-tomorrow
  criteria:
  - id: confirms-two-month-pause
    name: Confirms requested pause
    description: Confirms that Dev's subscription will be paused for two months, rather than merely describing
      the pause policy or requiring Dev to make the change in their account. Does not shorten, extend,
      or reject the requested pause, which is within the three-month limit.
    dimension: policy_compliance
    weight: 3.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: addresses-tomorrows-renewal
    name: Explains imminent renewal
    description: Clearly states that the pause takes effect before tomorrow's renewal so that renewal
      is skipped. If the reply instead makes the timing conditional, it must explain that a change made
      after renewal applies from the next box, without suggesting the already-renewed box is automatically
      canceled.
    dimension: actionability
    weight: 3.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: allows-early-resumption
    name: Offers earlier resumption
    description: Explicitly tells Dev they can resume the subscription earlier at any time, rather than
      implying they must wait the full two months.
    dimension: completeness
    weight: 2.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    also_judge: false
  - id: no-invented-resume-date
    name: No invented calendar date
    description: Does not invent a specific calendar date for resuming the subscription or the next shipment.
      Relative wording such as 'after the two-month pause' is acceptable.
    dimension: groundedness
    weight: 2.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: email-greeting
    name: Required greeting
    description: Opens with “Hi” followed by a first name and a comma, or with “Hi there,”. Whether the
      first name matches the input is assessed separately.
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
    shared: true
  - id: email-word-count
    name: 60–180 words
    description: The entire response, including the greeting and signature, contains 60–180 words.
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    check:
      type: length
      unit: words
      min: 60
      max: 180
    also_judge: false
    shared: true
  - id: fixed-signature-text
    name: Required signature text
    description: 'Includes both fixed signature phrases: “Warm regards,” and “The Brightside Coffee team”.'
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    check:
      type: contains
      values:
      - Warm regards,
      - The Brightside Coffee team
      match: all
      case_sensitive: true
    also_judge: false
    shared: true
  - id: plain-text-email-only
    name: Plain-text email body
    description: Contains only a plain-text customer-facing email body, without Markdown formatting, a
      subject header, or commentary to the support agent.
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    also_judge: false
    shared: true
- test_case_id: opened-bag-refund-request
  criteria:
  - id: no-refund
    name: No refund for an opened bag
    description: Does not offer or promise a refund for the opened bag.
    dimension: policy_compliance
    weight: 3.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: taste-promise
    name: Offers the Taste Promise
    description: Offers a one-time free replacement bag of a different coffee.
    dimension: policy_compliance
    weight: 3.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: no-discount
    name: No discount
    description: Does not offer a discount, code or credit.
    dimension: policy_compliance
    weight: 2.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    check:
      type: not_contains
      values:
      - '% off'
      - discount code
      - promo code
      - coupon
      match: any
      case_sensitive: false
    also_judge: true
  - id: helps-choose
    name: Helps choose the replacement
    description: Suggests a less acidic coffee or asks about their taste, so the replacement is likely
      to suit them.
    dimension: actionability
    weight: 1.5
    scale: 1-4
    anchors:
      '1': No help choosing.
      '2': Generic "pick any coffee".
      '3': Asks about preferences or names a coffee, but not both clearly.
      '4': Names a suitable lower-acidity option and/or asks a specific taste question, and says how to
        claim it.
    must_pass: false
    also_judge: false
  - id: explains-kindly
    name: Explains the policy kindly
    description: Explains why opened bags can't be refunded without sounding defensive.
    dimension: tone
    weight: 1.0
    scale: 1-4
    anchors:
      '1': Blunt refusal or blames the customer's taste.
      '2': Correct but cold.
      '3': Kind, slightly scripted.
      '4': Kind, empathetic about the taste, frames the Taste Promise positively.
    must_pass: false
    also_judge: false
  - id: sign-off
    name: Correct sign-off
    description: Ends with "Warm regards," then "The Brightside Coffee team".
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    check:
      type: regex
      pattern: Warm regards,\s*\n\s*The Brightside Coffee team\s*\Z
    also_judge: false
  - id: length
    name: 60-180 words
    description: The reply is between 60 and 180 words.
    dimension: format
    weight: 1.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    check:
      type: length
      unit: words
      min: 60
      max: 180
    also_judge: false
- test_case_id: angry-discount-demand
  criteria:
  - id: calm-apology
    name: Acknowledges repeated frustration
    description: Acknowledges the customer's frustration about a second delivery concern and apologizes
      without blaming the customer, arguing about the review threat, or becoming defensive.
    dimension: tone
    weight: 2.0
    scale: 1-4
    anchors:
      '1': Dismisses the complaint, blames the customer, or responds defensively to the review threat.
      '2': Uses a generic apology but barely acknowledges the customer's frustration, or undercuts the
        apology with corrective language.
      '3': Apologizes and calmly acknowledges the frustration without blame or defensiveness.
      '4': Specifically recognizes how frustrating a second delivery concern feels, apologizes naturally,
        and smoothly moves toward practical help without validating an unsupported claim that this shipment
        is overdue.
    must_pass: false
    also_judge: false
  - id: accurate-transit-window
    name: Accurate shipping status
    description: 'States that order #BC-20611 is in transit, having shipped four business days ago, and
      that standard shipping takes 3–5 business days. Does not characterize it as confirmed lost or overdue,
      invent tracking events, or guarantee an arrival date.'
    dimension: accuracy
    weight: 3.0
    scale: pass_fail
    anchors: {}
    must_pass: true
    also_judge: false
  - id: concrete-follow-up
    name: Clear next step
    description: Gives a concrete next step consistent with the parcel still being within its 3–5-business-day
      shipping window, such as asking the customer to reply if it has not arrived after that window so
      support can investigate. Does not substitute reassurance alone for an action or promise a free reship
      while tracking is still in transit.
    dimension: actionability
    weight: 2.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    also_judge: false
  - id: no-unnecessary-escalation
    name: No review-threat escalation
    description: Handles the delivery complaint through ordinary support rather than handing it to the
      team lead solely because the customer threatens a one-star review. Does not treat this as a legal
      threat or chargeback.
    dimension: escalation
    weight: 2.0
    scale: pass_fail
    anchors: {}
    must_pass: false
    also_judge: false
