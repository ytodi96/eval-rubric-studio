[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evalstudio"
version = "0.1.0"
description = "Eval & Rubric Studio: measure and improve the output quality of any AI use case."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yash Todi" }]
dependencies = [
    "openai>=3.41.0,<4",
    "anthropic>=2.3.0,<3",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
evalstudio = "evalstudio.cli:app"

[tool.setuptools.packages.find]
include = ["evalstudio*"]

[tool.setuptools.package-data]
evalstudio = ["web/templates/*.html", "web/static/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a paid AI API (run with --live)"]
